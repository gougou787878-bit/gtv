<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>上传规则</title>
    <style>
        　body {
            font: normal 100% Helvetica, Arial, sans-serif;
        }

        p {
            font-size: 14pt;
            padding: 1.2pt 17pt;
            line-height: 24pt;
            color: rgb(51, 51, 51);
        }
    </style>
</head>
<body>

<p> 1、禁止上传未成年、真实强奸、枪支、偷拍、侵害他人隐私等违规内容。</p>
<p> 2、禁止在作品视频中添加个人联系方式、植入广告、水印。</p>
<p> 3、作品大小建议不超过100M，超过100M容易上传失败。</p>
<p> 4、每天头两部视频必须为免费视频，收费作品必须30秒以上，否则无法通过审核。</p>
<p> 5、画面模糊或画面带有其他网站字样将不会通过审核。</p>
<p> 6、上传原创作品将会提高视频曝光率且更容易通过审核。</p>
<p> 7、上传的作品将由平台进行审核，时间为24小时内，请注意查收反馈。</p>
<p> 8、在视频中任意位置，发现添加联系方式或插入广告，将永久禁止上传。</p>

</body>
</html>

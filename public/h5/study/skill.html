<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>工具推荐</title>
</head>
<style>
  * {
    margin: 0;
    padding: 0;
  }

  body {
    font-size: 0.13rem;
    position: relative;
  }

  .back {
    width: 0.1rem;
    height: 0.25rem;
    background: url(./images/back2@2x.png) no-repeat center;
    background-size: contain;

  }

  .title {
    flex: 1;
    text-align: center;
  }

  .head {
    position: sticky;
    background: #fff;
    box-sizing: border-box;
    top: 0;
    text-align: center;
    color: #000;
    font-size: 0.18rem;
    height: 0.435rem;
    line-height: 0.435rem;
    padding: 0 0.2rem;
    display: flex;
    align-items: center;
  }

  .div_box {
    width: 2.95rem;
    margin: 0 auto;
  }

  a {
    text-decoration: none;
    display: block;
    color: #72b9eb;
    width: 100%;
    height: 100%;
  }

  .item {
    width: 100%;
    border-bottom: 0.005rem solid #e5e5e5;
    padding: 0.16rem 0;
    display: flex;
    flex-direction: row;
  }

  .item>.left {
    margin-right: 0.195rem;
    display: flex;
    flex-direction: column;
  }

  .app_icon {
    width: 0.55rem;
    height: 0.55rem;
    margin-bottom: 0.14rem;
  }

  .item>.right {
    color: 0.16rem;
    color: #8b8b8b;
  }

  .item>.right span {
    color: #3a3a3a;
  }

  .type_ {
    margin-bottom: 0.115rem;
  }

  .detail {
    font-size: 0.14rem;
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
  }
</style>

  function xing(num) {
    let a = ''
    for (let i = 0; i < num; i++) {
      a += '<img src="./images/xing@2x.png" />'
    }
    return a
  }
  dataList.forEach(function (item) {
    listDom += `<li class="item">
       <div class="left">
         <div class="app_icon" style="background:url(${item.logo})  no-repeat;background-size: cover;"></div>
         <div><a href="${item.toolLink}">
            立即访问
         </a></div>
       </div>
       <div class="right">
          <p class="type_">名称: <span>${item.title}</span></p>
          <p class="type_">难度: <span>${xing(item.difficulty)}</span></p>
          <p class="type_">类型: <span>${item.type}</span></p>
          <p class="detail">${item.content}</p>

  })
</script>

<body>

  <ul class="div_box">
    <script>
      document.write(listDom)
    </script>
  </ul>
</body>
<script type="text/javascript">
    // 計算rem單位
    (function (doc, win) {
      var docEl = doc.documentElement,
        isIOS = navigator.userAgent.match(/\(i[^;]+;( U;)? CPU.+Mac OS X/),
        dpr = isIOS ? Math.min(win.devicePixelRatio, 3) : 1,
        dpr = window.top === window.self ? dpr : 1, //被iframe引用時，禁止縮放
        dpr = 1,
        scale = 1 / dpr,
        resizeEvt = 'orientationchange' in window ? 'orientationchange' : 'resize';
      docEl.dataset.dpr = dpr;
      var metaEl = doc.createElement('meta');
      metaEl.name = 'viewport';
      metaEl.content = 'initial-scale=' + scale + ',maximum-scale=' + scale + ', minimum-scale=' + scale;
      docEl.firstElementChild.appendChild(metaEl);
      var recalc = function () {
        var width = docEl.clientWidth;
        if (width / dpr > 750) {
          width = 750 * dpr;
        }
        // 乘以100，px : rem = 100 : 1
        docEl.style.fontSize = 100 * (width / 350) + 'px';
      };
      recalc()
      if (!doc.addEventListener) return;
      win.addEventListener(resizeEvt, recalc, false);
    })(document, window);
</script>

</html>

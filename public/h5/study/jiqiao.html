<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>创作技巧</title>
</head>
<style>
    *{
        margin: 0;
        padding: 0;
    }
    img{
        display: block;
        width: 100%;
    }
    body{
        background: #fff;
    }
    li{
        list-style: none;
        margin-bottom: 0.2rem;
    }
    .list_box{
        padding: 0.12rem;
    }
</style>
<body>
<ul class="list_box">
    <li>
        <a href="boluomncode://elink?url=http://p.cnkamax.com/useruploadfiles/1b44f9b75850ae5f48e7d77ebc58dfed/1b44f9b75850ae5f48e7d77ebc58dfed.m3u8"><img src="./image/img_1.png" alt=""></a>
    </li>
    <li>
        <a href="boluomncode://elink?url=http://p.cnkamax.com/useruploadfiles/657d6e5277ee68c71c63289b6ec5d855/657d6e5277ee68c71c63289b6ec5d855.m3u8"><img src="./image/img_2.png" alt=""></a>
    </li>
</ul>
</body>
<script type="text/javascript">
    // 計算rem單位
    (function (doc, win) {
        var docEl = doc.documentElement,
            isIOS = navigator.userAgent.match(/\(i[^;]+;( U;)? CPU.+Mac OS X/),
            dpr = isIOS ? Math.min(win.devicePixelRatio, 3) : 1,
            dpr = window.top === window.self ? dpr : 1, //被iframe引用時，禁止縮放
            dpr = 1,
            scale = 1 / dpr,
            resizeEvt = 'orientationchange' in window ? 'orientationchange' : 'resize';
        docEl.dataset.dpr = dpr;
        var metaEl = doc.createElement('meta');
        metaEl.name = 'viewport';
        metaEl.content = 'initial-scale=' + scale + ',maximum-scale=' + scale + ', minimum-scale=' + scale;
        docEl.firstElementChild.appendChild(metaEl);
        var recalc = function () {
            var width = docEl.clientWidth;
            if (width / dpr > 750) {
                width = 750 * dpr;
            }
            // 乘以100，px : rem = 100 : 1
            docEl.style.fontSize = 100 * (width / 350) + 'px';
        };
        recalc()
        if (!doc.addEventListener) return;
        win.addEventListener(resizeEvt, recalc, false);
    })(document, window);
</script>
</html>
